aid: siena
name: Siena
description: >-
  Siena AI is an empathic AI agent platform built for commerce brands. It combines
  AI automation with human empathy to handle customer service across email, chat,
  SMS, social, and WhatsApp, and integrates with Shopify, Gorgias, Zendesk,
  Kustomer, Recharge, Klaviyo and 20+ commerce tools. Its agents cover support,
  shopping, reviews, QA, order tracking, and post-purchase workflows, letting
  brands automate 60-80% of support tickets while preserving brand voice. Siena is
  backed by Sierra Ventures and holds SOC 2 Type II, GDPR, CPRA, and HIPAA compliance.
